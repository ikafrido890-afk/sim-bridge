name: Build SIM Bridge APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Setup
        run: |
          mkdir -p /tmp/b/lib
          cp pubspec.yaml /tmp/b/ || true
          cp lib/main.dart /tmp/b/lib/ || true
          flutter create . --org com.simbridge --project-name sim_bridge --platforms android --overwrite
          cp /tmp/b/pubspec.yaml ./ || true
          cp /tmp/b/lib/main.dart ./lib/ || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sim-bridge-apk
          path: build/app/outputs/flutter-apk/app-release.apk
